# Coturn TURN Server Configuration

listening-port=3478
tls-listening-port=5349

# External IP (set via environment in docker-compose or hardcode)
external-ip=${TURN_EXTERNAL_IP}

# Realm
realm=secureteam.local
server-name=secureteam.local

# Authentication
lt-cred-mech
user=${TURN_USERNAME}:${TURN_PASSWORD}

# Security
no-cli
no-tlsv1
no-tlsv1_1

# Logging
log-file=stdout
verbose

# Ports
min-port=49152
max-port=65535

# Fingerprinting
fingerprint
